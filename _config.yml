title: Elyas-Blog
description: "Just a Summary Notes For A Personal Blog"
author:
  name: "SomeHacker"
  email: "elyas@google.com"
  url: "https://ashishchaudhary.in/hacker-blog"

baseurl: /
 
source: .
destination: ./_site
permalink: /:title
pagination:
  enabled: true
  per_page: 4
  permalink: '/:num/'
  # title: ':title - page :num'
  title: ':title [:num]'
  sort_field: 'date'
  sort_reverse: true

autopages:
  enabled: false

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

future: true
plugins:
  - jekyll-seo-tag
  - jekyll-paginate-v2
  - jekyll-sitemap

# Custom variables
owner : "Elyas-Blog"
year : "2026"



