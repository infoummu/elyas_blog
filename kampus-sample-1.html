  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var sidebar = document.getElementById('sidebar');
      var toggleBtn = document.getElementById('sidebarToggle');
      var mainContent = document.getElementById('mainContent');
      var hamburger = document.getElementById('mobileHamburger');
      var themeToggle = document.getElementById('themeToggle');

      // Load saved sidebar state
      var isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
      if (isCollapsed) {
        sidebar.classList.add('collapsed');
        mainContent.classList.add('expanded');
      }
      // Clean up FOUC-prevention class, allowing toggle to work normally
      document.body.classList.remove('sidebar-pre-collapsed');

      // ---- Desktop sidebar toggle (collapsed/expanded) ----
      toggleBtn.addEventListener('click', function() {
        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('expanded');
        localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
      });

      // ---- Mobile hamburger 3-state cycling ----
      var mobilePhase = 0; // 0=hidden, 1=icon(up), 2=full, 3=icon(down)
      var layoutWrapper = document.querySelector('.layout-wrapper');
      var sidebarHeader = sidebar.querySelector('.sidebar-header');

      function applyMobileState(phase) {
        sidebar.classList.remove('mobile-icon', 'mobile-full');
        mainContent.classList.remove('hamburger-sidebar-visible');
        
        if (phase === 1 || phase === 3) {
          sidebar.classList.add('mobile-icon');
          mainContent.classList.add('hamburger-sidebar-visible');
          // Move hamburger INSIDE sidebar header (merges with sidebar)
          if (hamburger && hamburger.parentNode !== sidebarHeader) {
            sidebarHeader.insertBefore(hamburger, sidebarHeader.firstChild);
          }
        } else if (phase === 2) {
          sidebar.classList.add('mobile-full');
          mainContent.classList.add('hamburger-sidebar-visible');
          // Move hamburger INSIDE sidebar header (merges with sidebar)
          if (hamburger && hamburger.parentNode !== sidebarHeader) {
            sidebarHeader.insertBefore(hamburger, sidebarHeader.firstChild);
          }
        } else {
          // phase 0: hidden - move hamburger OUTSIDE sidebar (floating fixed)
          if (hamburger && hamburger.parentNode !== layoutWrapper) {
            layoutWrapper.insertBefore(hamburger, sidebar);
          }
        }
      }

      if (hamburger) {
        // Check if a saved mobile phase exists
        var savedPhase = parseInt(localStorage.getItem('mobilePhase'), 10);
        if (!isNaN(savedPhase) && savedPhase >= 0 && savedPhase <= 3) {
          mobilePhase = savedPhase;
          applyMobileState(mobilePhase);
        } else {
          // Ensure hamburger starts outside sidebar on fresh load
          mobilePhase = 0;
          applyMobileState(0);
        }

        hamburger.addEventListener('click', function(e) {
          e.stopPropagation();
          mobilePhase = (mobilePhase + 1) % 4;
          applyMobileState(mobilePhase);
          localStorage.setItem('mobilePhase', mobilePhase);
        });
      }

      // ---- Close sidebar when tapping outside on mobile ----
      function closeMobileSidebar(e) {
        if (sidebar.classList.contains('mobile-icon') || sidebar.classList.contains('mobile-full')) {
          // Don't close if clicking inside sidebar or on the hamburger button
          if (!sidebar.contains(e.target) && (!hamburger || !hamburger.contains(e.target))) {
            mobilePhase = 0;
            applyMobileState(0);
            localStorage.setItem('mobilePhase', 0);
          }
        }
      }
      document.addEventListener('mousedown', closeMobileSidebar);
      document.addEventListener('touchstart', closeMobileSidebar, { passive: true });

      // ---- Theme toggle ----
      if (themeToggle) {
        themeToggle.addEventListener('click', function() {
          if (document.body.classList.contains('light-theme')) {
            document.body.classList.remove('light-theme');
            localStorage.setItem('theme', 'dark');
          } else {
            document.body.classList.add('light-theme');
            localStorage.setItem('theme', 'light');
          }
        });
      }
    });
  </script>

  <script>
    (function() {
      var btn = document.getElementById('backToTop');
      if (!btn) return;

      // The scrollable element is the main content area
      var scrollContainer = document.getElementById('mainContent');

      function checkScroll() {
        if (scrollContainer.scrollTop > 300) {
          btn.classList.add('visible');
        } else {
          btn.classList.remove('visible');
        }
      }

      scrollContainer.addEventListener('scroll', checkScroll);
      checkScroll();

      btn.addEventListener('click', function() {
        scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
      });
    })();
  </script>
